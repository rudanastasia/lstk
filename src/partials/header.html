<header class="header{{#if isInnerPage}} header--inner{{/if}}">
  <a href="{{base}}" class="logo" aria-label="Фабрика стальных каркасов — на главную">
    <svg class="logo__icon" aria-hidden="true">
      <use href="/assets/sprite/sprite.svg#{{#if isInnerPage}}logo-black{{else}}logo{{/if}}"></use>
    </svg>
  </a>
  <nav class="menu" aria-label="Основное меню">
    <ul class="menu__list">
      <li class="menu__item">
        <a href="{{base}}pages/about" class="menu__link">О нас</a>
      </li>
      <li class="menu__item">
        <a href="{{base}}pages/projects" class="menu__link">Проекты</a>
      </li>
      <li class="menu__item">
        <a href="{{base}}#our_advantages" class="menu__link">Преимущества</a>
      </li>
      <li class="menu__item">
        <a href="{{base}}pages/services" class="menu__link">Услуги</a>
      </li>
      <li class="menu__item">
        <a href="{{base}}#our_news" class="menu__link">Новости</a>
      </li>
      <li class="menu__item">
        <a href="{{base}}pages/contacts" class="menu__link">Контакты</a>
      </li>
    </ul>
  </nav>
  <a href="tel:+79184451324" class="header__phone-number"> +7&nbsp;918&nbsp;445&nbsp;13&nbsp;24 </a>
  <div class="header__mobile">
    <a href="tel:+79184451324" class="header__phone-button" aria-label="Позвонить"
      ><svg class="mobile__icon" aria-hidden="true">
        <use
          href="/assets/sprite/sprite.svg#{{#if isInnerPage}}call-dark{{else}}call-light{{/if}}"
        ></use>
      </svg>
    </a>
    <button class="hamburger" type="button" aria-label="Открыть меню">
      <span class="hamburger__plank{{#if isInnerPage}} hamburger__plank--dark{{/if}}"></span>
      <span class="hamburger__plank{{#if isInnerPage}} hamburger__plank--dark{{/if}}"></span>
    </button>
  </div>
</header>
