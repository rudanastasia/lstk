<nav class="breadcrumbs" aria-label="Хлебные крошки">
    <ul class="breadcrumbs__list">
        {{#each breadcrumbs}}
        {{#if @last}}
        <li class="breadcrumbs__item breadcrumbs__item--active">
            {{title}}
        </li>
        {{else}}
        <li class="breadcrumbs__item">
            <a href="{{../base}}{{url}}" class="breadcrumbs__link">{{title}}</a>
        </li>
        {{/if}}
        {{/each}}
    </ul>
</nav>
